<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">Leakage-aware volatility forecasting</title>
<desc id="desc">A navy and teal research banner for the BCT article companion. The abstract line is decorative and does not represent market observations.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102238"/><stop offset="1" stop-color="#173C4A"/></linearGradient>
  <linearGradient id="wave" x2="1"><stop stop-color="#69D7C4" stop-opacity=".1"/><stop offset="1" stop-color="#69D7C4"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#AAC5CD" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1280" height="400" rx="20" fill="url(#bg)"/>
<rect width="1280" height="400" rx="20" fill="url(#grid)"/>
<rect x="56" y="46" width="7" height="32" rx="3" fill="#69D7C4"/>
<text x="80" y="69" fill="#93D8CF" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" letter-spacing="3">RESEARCH / BCT 2026</text>
<text x="56" y="154" fill="#F1F6FA" font-family="DejaVu Sans, Arial, sans-serif" font-size="53" font-weight="bold">Leakage-aware</text>
<text x="56" y="219" fill="#F1F6FA" font-family="DejaVu Sans, Arial, sans-serif" font-size="53" font-weight="bold">volatility forecasting</text>
<text x="59" y="269" fill="#A9C1CC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21">Daily data. Temporal discipline. Risk decisions.</text>
<line x1="58" y1="310" x2="566" y2="310" stroke="#91B4C0" stroke-opacity=".22"/>
<text x="59" y="346" fill="#9DC7D1" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">SIX INSTRUMENTS</text>
<circle cx="254" cy="340" r="3" fill="#69D7C4"/>
<text x="273" y="346" fill="#9DC7D1" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">FIVE-DAY HORIZON</text>
<g transform="translate(825 82)">
 <rect x="0" y="0" width="390" height="236" rx="16" fill="#0A1D30" fill-opacity=".4" stroke="#78B7B6" stroke-opacity=".2"/>
 <text x="24" y="37" fill="#93BABF" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" letter-spacing="2">INFORMATION / TIME</text>
 <path d="M24 180 H365 M24 70 V180" stroke="#93BABF" stroke-opacity=".25" fill="none"/>
 <rect x="239" y="61" width="126" height="119" fill="#69D7C4" fill-opacity=".05"/>
 <path d="M24 147 L46 143 64 152 85 125 107 138 127 98 145 132 162 113 183 128 201 102 220 119 239 109" fill="none" stroke="url(#wave)" stroke-width="3" stroke-linejoin="round"/>
 <path d="M239 109 C270 93 280 131 304 102 S339 109 365 84" fill="none" stroke="#A2DFD0" stroke-width="3" stroke-dasharray="5 6"/>
 <line x1="239" y1="61" x2="239" y2="180" stroke="#C7E7DD" stroke-opacity=".6" stroke-dasharray="3 6"/>
 <text x="24" y="211" fill="#9CB9C7" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">OBSERVED</text>
 <text x="266" y="211" fill="#9CB9C7" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">FORECAST</text>
</g>
</svg>
